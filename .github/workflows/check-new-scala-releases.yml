name: Check for new Scala releases
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip dispatching add-version.yml; just log what would happen"
        required: false
        type: boolean
        default: false
  schedule:
    # 3pm and 9pm in Poland (CEST, UTC+2). During CET (winter) this fires 1h earlier locally.
    - cron: '0 13,19 * * 1-5'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Find new releases and dispatch add-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          known_versions="$(grep -v '^[[:space:]]*$' scala-versions | sort -u)"

          # Fetch both release lists once; the cutoff and the candidate list are both
          # derived from them.
          releases_file="$(mktemp)"
          gh api "repos/scala/scala3/releases?per_page=30" -H "Accept: application/vnd.github+json" \
            | jq -c '.[] | select(.draft == false) | {version: .tag_name, created_at, artifact: "scala3-compiler_3"}' \
            > "$releases_file"
          gh api "repos/scala/scala/releases?per_page=30" -H "Accept: application/vnd.github+json" \
            | jq -c '.[] | select(.draft == false) | {version: (.tag_name | sub("^v"; "")), created_at, artifact: "scala-compiler"}' \
            >> "$releases_file"

          # Use the publish date of the most recently released version we already support as
          # a cutoff, so RCs that were removed from scala-versions after their final release
          # shipped (e.g. 3.3.8-RC2, dropped once 3.3.8 was out) aren't rediscovered as "new".
          #
          # Take the max publish date over every known version rather than picking a "latest"
          # version by string order: scala-versions is sorted lexically, where 3.10.0-RC1 sorts
          # before 3.3.5 and 3.9.0-RC4 sorts after 3.9.0. Neither lexical nor `sort -V` order
          # tracks release date (sort -V also ranks an RC above its own final), so any
          # version-ordering heuristic picks the wrong entry. Publish dates are the real
          # question being asked, so ask them directly.
          known_versions_json="$(jq -R . <<<"$known_versions" | jq -s -c .)"
          cutoff_entry="$(jq -s -c --argjson known "$known_versions_json" '
            map(select(.version as $v | $known | index($v)))
            | sort_by(.created_at)
            | last // empty
          ' "$releases_file")"

          if [ -z "$cutoff_entry" ]; then
            echo "::error::No known version from scala-versions found in the last 30 releases of either repo."
            echo "The cutoff can't be computed; widen the per_page window or check scala-versions."
            exit 1
          fi

          cutoff="$(jq -r '.created_at' <<<"$cutoff_entry")"
          cutoff_version="$(jq -r '.version' <<<"$cutoff_entry")"
          echo "Using cutoff $cutoff (publish date of most recent known version $cutoff_version)"
          echo "**Cutoff:** \`$cutoff\` (publish date of most recent known version \`$cutoff_version\`)" >> "$GITHUB_STEP_SUMMARY"

          fetch_candidates() {
            local artifact="$1"
            jq -c --arg cutoff "$cutoff" --arg artifact "$artifact" \
              'select(.artifact == $artifact) | select(.created_at >= $cutoff)' "$releases_file"
          }

          # Collect candidates as JSON lines: {version, created_at, artifact}
          candidates_file="$(mktemp)"

          fetch_candidates "scala3-compiler_3" >> "$candidates_file"
          fetch_candidates "scala-compiler" >> "$candidates_file"

          # Filter out already-known versions, oldest first so we always pick the oldest unreleased one
          new_candidates_file="$(mktemp)"
          while IFS= read -r line; do
            version="$(jq -r '.version' <<<"$line")"
            if ! grep -qxF "$version" <<<"$known_versions"; then
              echo "$line" >> "$new_candidates_file"
            fi
          done < "$candidates_file"

          new_count="$(wc -l < "$new_candidates_file" | tr -d ' ')"
          echo "Found $new_count new release(s) (created on/after $cutoff, not in scala-versions)"

          if [ "$new_count" -eq 0 ]; then
            echo "Nothing to do."
            exit 0
          fi

          # Drop RCs whose final release is also a candidate: publishing 3.9.0-RC5 and
          # 3.9.0-RC6 right before 3.9.0 is wasted work (one scheduled run each, and the
          # RCs get dropped from scala-versions again once the final ships — see d4200da).
          # An RC with no final in the set is still picked up, so pre-release support works.
          pruned_file="$(mktemp)"
          jq -s -c '
            (map(select(.version | test("-RC[0-9]+$") | not) | .version)) as $finals
            | map(select(
                .version as $v
                | ($finals | any(. as $f | $v | startswith($f + "-RC")))
                | not
              ))
            | .[]
          ' "$new_candidates_file" > "$pruned_file"

          pruned_count="$(wc -l < "$pruned_file" | tr -d ' ')"
          if [ "$pruned_count" -ne "$new_count" ]; then
            echo "Skipping $((new_count - pruned_count)) RC(s) superseded by a final release in this batch."
          fi

          # Sort oldest first by created_at
          sorted_file="$(mktemp)"
          jq -s 'sort_by(.created_at) | .[]' -c "$pruned_file" > "$sorted_file"

          jq -r '"  - " + .version + " (created " + .created_at + ")"' "$sorted_file"

          # Fetch published versions from Maven Central — once per artifact, not per candidate.
          # For Scala 3 we also require scala3-directives-parser_3: sbt needs it to build a 3.x
          # compiler, and it can lag behind the compiler on Maven Central (e.g. 3.9.0-RC2 shipped
          # a compiler but no directives-parser, which made the build unresolvable).
          maven_versions_file="$(mktemp)"
          for artifact in scala3-compiler_3 scala3-directives-parser_3 scala-compiler; do
            curl -sf "https://repo1.maven.org/maven2/org/scala-lang/${artifact}/maven-metadata.xml" \
              | grep -oE '<version>[^<]+</version>' \
              | sed -E 's:</?version>::g' \
              | awk -v a="$artifact" '{print a" "$0}' \
              >> "$maven_versions_file"
          done

          # Find the oldest candidate that's already fully published
          picked=""
          while IFS= read -r line; do
            version="$(jq -r '.version' <<<"$line")"
            artifact="$(jq -r '.artifact' <<<"$line")"

            # Every candidate must have its primary compiler artifact.
            required_artifacts="$artifact"
            # Scala 3 additionally needs the directives-parser at the same version.
            if [ "$artifact" = "scala3-compiler_3" ]; then
              required_artifacts="$required_artifacts scala3-directives-parser_3"
            fi

            missing=""
            for req in $required_artifacts; do
              if ! grep -qxF "$req $version" "$maven_versions_file"; then
                missing="$req"
                break
              fi
            done

            if [ -z "$missing" ]; then
              echo "$version: available on Maven Central ($required_artifacts)"
              picked="$version"
              break
            else
              echo "$version: not fully on Maven Central yet (missing $missing) — skipping"
            fi
          done < "$sorted_file"

          if [ -z "$picked" ]; then
            echo "No new releases are on Maven Central yet. Will retry next run."
            exit 0
          fi

          # Guard against re-dispatching a version that's already being published (or was just
          # published) by another run: a failed publish leaves its tracking issue open without
          # updating scala-versions, so the same version can otherwise be picked again on every
          # run until the issue is closed, spawning a fresh duplicate issue each time.
          existing_issue="$(gh issue list --state open --search "\"Release triggered for Scala $picked\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing_issue" ]; then
            echo "An open tracking issue (#$existing_issue) already exists for $picked. Skipping dispatch."
            exit 0
          fi

          # The issue check above is the primary guard, but it only works if the tracking
          # issue was actually created. If add-version fails before that point, no issue
          # exists and $picked would be re-dispatched on every run. Fall back to asking
          # what the *latest* add-version run for this exact version did.
          #
          # Only the latest run counts, not "any run ever failed": a stale failure would
          # otherwise block the version forever, even after the cause was fixed. Re-running
          # add-version successfully (or manually) clears the block on its own.
          latest_run="$(gh run list --workflow=add-version.yml --limit 100 \
            --json displayTitle,url,conclusion,status \
            --jq "[.[] | select(.displayTitle | startswith(\"Add Scala Version $picked (\"))] | .[0] // empty")"

          if [ -n "$latest_run" ]; then
            latest_status="$(jq -r '.status' <<<"$latest_run")"
            latest_conclusion="$(jq -r '.conclusion' <<<"$latest_run")"
            latest_url="$(jq -r '.url' <<<"$latest_run")"

            if [ "$latest_status" != "completed" ]; then
              echo "add-version is already $latest_status for $picked ($latest_url). Skipping dispatch."
              exit 0
            fi

            if [ "$latest_conclusion" != "success" ]; then
              echo "The most recent add-version run for $picked $latest_conclusion ($latest_url)."
              echo "Not re-dispatching; investigate or re-run that run first."
              {
                echo "**Skipped \`$picked\`:** the most recent [add-version run]($latest_url) $latest_conclusion and left no open tracking issue."
                echo "Re-run add-version.yml once the cause is fixed — a successful run clears this guard."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "[dry-run] Would dispatch add-version.yml for $picked"
          else
            echo "Dispatching add-version.yml for $picked"
            gh workflow run add-version.yml --ref "${GITHUB_REF_NAME}" \
              -f "scala_version=$picked"
          fi
